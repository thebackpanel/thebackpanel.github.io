<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Orange accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#FF4D00"/>
  <rect x="0" y="622" width="1200" height="8" fill="#FF4D00"/>
  <!-- Icon -->
  <rect x="80" y="165" width="300" height="300" rx="48" fill="#FF4D00"/>
  <circle cx="170" cy="230" r="22" fill="#fff"/>
  <circle cx="290" cy="230" r="22" fill="#fff"/>
  <text x="230" y="360" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="72" fill="#fff" letter-spacing="4">BACK</text>
  <text x="230" y="430" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="72" fill="#fff" letter-spacing="4">PANEL</text>
  <!-- Text -->
  <text x="440" y="280" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="-3">BACKPANEL</text>
  <text x="440" y="360" font-family="Arial,sans-serif" font-weight="600" font-size="36" fill="#FF4D00">AUTO RICKSHAW ADVERTISING</text>
  <text x="440" y="420" font-family="Arial,sans-serif" font-weight="400" font-size="28" fill="#888">Your brand, on the back of an auto.</text>
  <text x="440" y="470" font-family="Arial,sans-serif" font-weight="400" font-size="22" fill="#555">RTO-certified · Bilingual · GPS-proofed · Bengaluru</text>
</svg>
